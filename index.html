<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-16">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="assets/styles/variables.css">
	<link rel="stylesheet" href="assets/styles/structure.css">

	<title>GibbMeOverlay</title>
</head>
<body>
	<div id="app-structure-content-wrapper"></div>
	<div id="app-structure-statusbar"></div>
	<canvas id="test" width="1920" height="600" ></canvas>
	<script defer>
		let canvas = document.getElementById("test") 
		let ctx = canvas.getContext("2d")
		window.audio.onSpectrum((spectrum)=>{
			ctx.clearRect(0,0,1920,600)
			var i = 0
			for (let k in spectrum){
				let vol = spectrum[k]
				ctx.fillRect(i,0,i+1,vol*600)
				i++
			}
			Object.keys(spectrum).forEach((freq)=>{
			})
		})
	</script>
</body>
</html>
