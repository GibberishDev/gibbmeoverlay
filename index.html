<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-16">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link rel="stylesheet" href="assets/styles/variables.css">
	<link rel="stylesheet" href="assets/styles/structure.css">

	<script src="./src/renderer/icon_element.js"></script>

	<title>GibbMeOverlay</title>
</head>
<body>
	<div id="app-main-frame">
		<div id="app-main-sidebar" class="state-collapsed">
			<div class="sidebar-element app-sidebar-toggle">
				<div class="icon-container">
					<icon-element class="app-icon-silhouette" icon-id="icon.app.icon-silhouette"></icon-element>
					<icon-element class="app-icon-color" icon-id="icon.app.icon-color"></icon-element>
					<svg id="sidebar-expand-marker"><path style="fill: none; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round;" d="M 4.21 8 L 12 15.97 L 4 23.96"></path></svg>
				</div>
				<div class="text-container">
					GibbMeOverlay
				</div>
			</div>
			<div class="sidebar-separrator"></div>
			<div class="sidebar-element">
				<div class="icon-container">
					<icon-element icon-id="icon.service.twitch"></icon-element>
				</div>
				<div class="text-container">
					Twitch
				</div>
			</div>
			<div class="sidebar-element">
				<div class="icon-container">
					<icon-element icon-id="icon.service.youtube"></icon-element>
				</div>
				<div class="text-container">
					YouTube
				</div>
			</div>
			<div class="sidebar-spacer"></div>
			<div class="sidebar-element">
				<div class="icon-container">
					<icon-element icon-id="icon.app.settings"></icon-element>
				</div>
				<div class="text-container">
					Settings
				</div>
			</div>
		</div>
		<div id="app-structure-content-wrapper">
			
		</div>
	</div>
	<div id="app-structure-statusbar">
		<div id="service-icons">
		</div>
	</div>
	
	<script src="./src/renderer/app_structure.js" defer></script>
</body>
</html>
