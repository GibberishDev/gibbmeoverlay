<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GibbMeOverlay</title>
	<style>
		body{background:#000;color:#ff0;margin:0;}
		iframe{margin:0;}
	</style>
</head>
<body>
</body>
<script defer>
	const params = new URL(location).searchParams;
	const PORT = params.get("port") || "10301";
	const WSPORT = params.get("wsport") || "10302";
	const ID = params.get("id")
	var ws = null
	var uuid = null

	function waitForOverlay() {
		if (ID == null) {
			document.body.innerHTML = "NO OVERLAY ID IN URL. ABORTING"
			return
		}
		fetch(`http://127.0.0.1:${PORT}/api/state`,{method:"GET",mode:"no-cors"})
			.then(response => {
				attemptConnection()
			})
			.catch(() => {
				setTimeout(waitForOverlay, 1000);
			});
	};
	function attemptConnection() {
		fetch(`http://127.0.0.1:${PORT}/api/state`)
		.then(resp=>{
			if (resp.ok) {initConnected()}
			else setTimeout(waitForOverlay, 1000);
		})
	}
	function initConnected() {
		ws = new WebSocket(`ws://127.0.0.1:${WSPORT}`)
		ws.onopen = () => {
			console.log("websocket connected")
			ws.send(JSON.stringify({
				type: "HANDSHAKE",
				id: ID
			}))
		}
		ws.onclose = (code, reason) => {
			console.log(`websocket disconnected`)
			setTimeout(waitForOverlay, 1000);
			ws = null
		}
		ws.onmessage = handleWebSocketMessage
	}
	function handleWebSocketMessage(data) {
		console.log(data)
	}

	waitForOverlay()

</script>
</html>
