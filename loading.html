<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		* {
			pointer-events: none;
			user-select: none;
		}
		svg {
			overflow: visible;
			position: absolute;
			top: -16px;
			width: calc(100% - 32px);
			height: calc(100% - 32px);
			margin: 16px;
		}
		html{background:transparent}
		body {
			display: flex;
			justify-content: center;
			overflow: hidden;
		}
		#bg {
			border: 2px solid #cc5333;
			background: linear-gradient(30deg,#15042e,#531909);
			position: absolute;
			top:0;left:0;
			width:100dvw;height:100dvh;
			z-index: 0;
			box-sizing: border-box;
		}
		#dragger{
			position:absolute;
			top:0;left:0;
			width:100dvw;height:100dvh;
			background:transparent;
			app-region:drag;
			z-index: 10;
		}
		#G{animation:g-anim 3s infinite forwards;}
		#M{animation:m-anim 3s infinite forwards;}
		#O{animation:o-anim 3s infinite forwards;}
		@keyframes g-anim{
			0%  {z-index:3;}
			33% {z-index:2;}
			66% {z-index:1;}
			76% {z-index:1;}
			77% {z-index:3;}
			100%{z-index:3;}
		}
		@keyframes m-anim{
			0%  {z-index:2;}
			33% {z-index:1;}
			43% {z-index:1;}
			44% {z-index:3;}
			66% {z-index:3;}
			100%{z-index:2;}
		}
		@keyframes o-anim{
			0%  {z-index:1;}
			10% {z-index:1;}
			11% {z-index:3;}
			33% {z-index:3;}
			66% {z-index:2;}
			100%{z-index:1;}
		}
		@font-face {
			font-family: FiraMonoNerd;
			src: url(./assets/fonts/FiraMonoNerdFontMono-Regular.otf);
		}
		#tooltip {
			color: #cc5333;
			font-family: "FiraMonoNerd";
			font-size: 16px;
			font-weight: bold;
			width: 100%;
			line-height: 64px;
			height: 64px;
			position: absolute;
			bottom: 32px;
			text-align: center;
		}
		#app-ver {
			color: #cc533380;
			font-family: "FiraMonoNerd";
			font-size: 16px;
			width: 100%;
			line-height: 64px;
			height: 64px;
			position: absolute;
			bottom: 0;
			text-align: center;
		}
	</style>
</head>

	<script>
		function setText(text) {document.querySelector("#tooltip").textContent = text}
