	<style>
		* {
			pointer-events: none;
			user-select: none;
		}
		svg {
			overflow: visible;
			position: absolute;
			width: calc(100% - 32px);
			height: calc(100% - 32px);
			margin: 16px;
		}
		body {
			display: flex;
			justify-content: center;
			background: #23074d;
		}
		#G {
			animation: g-anim 3s infinite forwards;
		}
		@keyframes g-anim {
			0%  {
				z-index: 3;
			}
			33% {
				z-index: 2;
			}
			66% {
				z-index: 1;
			}
			76% {
				z-index: 1;
			}
			77% {
				z-index: 3;
			}
			100%{
				z-index: 3;
			}
		}
		#M {
			animation: m-anim 3s infinite forwards;
		}
		@keyframes m-anim {
			0%  {
				z-index: 2;
			}
			33% {
				z-index: 1;
			}
			43% {
				z-index: 1;
			}
			44% {
				z-index: 3;
			}
			66% {
				z-index: 3;
			}
			100%{
				z-index: 2;
			}
		}
		#O {
			animation: o-anim 3s infinite forwards;
		}
		@keyframes o-anim {
			0%  {
				z-index: 1;
			}
			10% {
				z-index: 1;
			}
			11% {
				z-index: 3;
			}
			33% {
				z-index: 3;
			}
			66% {
				z-index: 2;
			}
			100%{
				z-index: 1;
			}
		}
	</style>
</head>
